name: Publicar API de Natal no Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/20261029020000_whatsapp_participants.sql'
      - '.github/scripts/apply-whatsapp-migration.mjs'
      - '.github/scripts/check-christmas-api.mjs'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-christmas-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar, migrar contatos e implantar christmas-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: eekiaggyowywtzbgdhbm

    steps:
      - name: Obter codigo da main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Conferir segredo necessario
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN nos secrets do repositorio."
            exit 1
          fi

      - name: Instalar dependencias e validar antes de alterar o servidor
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Aplicar migracao WhatsApp preservando os dados existentes
        run: node .github/scripts/apply-whatsapp-migration.mjs

      - name: Implantar a Edge Function
        run: npx --yes supabase@2.122.0 functions deploy christmas-api --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Listar funcoes publicadas
        run: npx --yes supabase@2.122.0 functions list --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verificar estado publico e bloqueio das operacoes privadas
        run: node .github/scripts/check-christmas-api.mjs
