name: Diagnosticar função de reset (somente leitura)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Verificar RPC e permissões sem alterar participantes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: eekiaggyowywtzbgdhbm
    steps:
      - name: Conferir respostas de erro recentes da API (somente metadados)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN
          const project = process.env.SUPABASE_PROJECT_ID
          // No request body, participant names or tokens appear in these metrics.
          const query = `SELECT
            source,
            toString(log_attributes['response.status_code']) AS status,
            count() AS requests
          FROM logs
          WHERE source IN ('edge_logs', 'function_edge_logs')
            AND log_attributes['request.path'] LIKE '%christmas-api%'
          GROUP BY source, status
          ORDER BY requests DESC
          LIMIT 15`
          const url = new URL(`https://api.supabase.com/v1/projects/${project}/analytics/endpoints/logs`)
          url.searchParams.set('sql', query)
          url.searchParams.set('iso_timestamp_start', '2026-10-29T14:00:00Z')
          url.searchParams.set('iso_timestamp_end', '2026-10-29T14:40:00Z')
          const result = await fetch(url, { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30000) })
          if (!result.ok) throw new Error(`Logs indisponíveis (HTTP ${result.status})`)
          const data = await result.json()
          if (data.error) throw new Error('Consulta de logs indisponível')
          console.log('HTTP de christmas-api (agregado):', JSON.stringify(data.result))
          NODE

      - name: Testar conexão PostgREST com parâmetros deliberadamente inválidos (sem reset)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          // A validação SQL interrompe antes de qualquer DELETE ou UPDATE.
          const ref = process.env.SUPABASE_PROJECT_ID
          const token = process.env.SUPABASE_ACCESS_TOKEN
          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${token}` },
            signal: AbortSignal.timeout(15000),
          })
          if (!response.ok) throw new Error(`Sem permissão para testar a conexão REST (HTTP ${response.status}).`)
          const data = await response.json()
          const keys = Array.isArray(data) ? data : (data?.api_keys ?? data?.keys ?? [])
          const elevated = keys.find(x => x.name === 'service_role' || x.id === 'service_role')
          const apiKey = elevated?.api_key
          if (!apiKey) throw new Error('Chave service_role não acessível; verificação REST ignorada.')
          const test = await fetch(`https://${ref}.supabase.co/rest/v1/rpc/reset_christmas_event`, {
            method: 'POST',
            headers: { apikey: apiKey, Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
            // IMPORTANT: both values are invalid by design. This must NOT reset the event.
            body: JSON.stringify({ p_mode: 'DIAGNOSTIC_ONLY', p_confirmation: 'DO_NOT_RESET' }),
            signal: AbortSignal.timeout(15000),
          })
          const result = await test.json().catch(() => ({}))
          console.log('Diagnóstico REST (sem alterar dados):', JSON.stringify({ http: test.status, code: result.code || null }))
          if (test.status === 200 || test.status === 204) throw new Error('RPC aceitou parâmetros inválidos. Investigar segurança!')
          if (result.code !== '22023') throw new Error('REST não chegou à validação do reset (consulta ou permissão).')
          NODE

      - name: Conferir RPC real no PostgreSQL (somente SELECT)
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN
          const project = process.env.SUPABASE_PROJECT_ID
          if (!token || !project) throw new Error('Configuração Supabase ausente.')
          const query = `SELECT
             (to_regprocedure('public.reset_christmas_event(text,text)') IS NOT NULL) AS rpc_exists,
             COALESCE(has_function_privilege('service_role', to_regprocedure('public.reset_christmas_event(text,text)'), 'EXECUTE'), false) AS service_role_can_execute,
             COALESCE(has_function_privilege('anon', to_regprocedure('public.reset_christmas_event(text,text)'), 'EXECUTE'), false) AS anonymous_can_execute,
             COALESCE(has_function_privilege('authenticated', to_regprocedure('public.reset_christmas_event(text,text)'), 'EXECUTE'), false) AS user_can_execute,
             COALESCE((SELECT prosecdef FROM pg_catalog.pg_proc WHERE oid = to_regprocedure('public.reset_christmas_event(text,text)')), false) AS security_definer,
             (SELECT COUNT(*) FROM public.christmas_event) AS event_rows,
             (SELECT COUNT(*) FROM pg_catalog.pg_trigger WHERE tgrelid='public.assignments'::regclass AND NOT tgisinternal) AS assignment_triggers,
             (SELECT COUNT(*) FROM pg_catalog.pg_constraint WHERE confrelid='public.assignments'::regclass) AS assignment_references`
          const response = await fetch(`https://api.supabase.com/v1/projects/${project}/database/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query }),
            signal: AbortSignal.timeout(30000),
          })
          if (!response.ok) throw new Error(`Consulta de diagnóstico indisponível (HTTP ${response.status})`)
          const data = await response.json()
          const row = Array.isArray(data) ? data[0] : data?.data?.[0]
          if (!row || typeof row.rpc_exists !== 'boolean') throw new Error('Formato inesperado do resultado (dados ocultados).')
          console.log('Diagnóstico somente leitura:', JSON.stringify(row))
          if (!row.rpc_exists || !row.service_role_can_execute || row.anonymous_can_execute || row.user_can_execute || !row.security_definer) {
            throw new Error('RPC de reset não está instalada ou possui permissões inesperadas.')
          }
          NODE
