name: Diagnóstico transacional do reset (desfaz automaticamente)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provar-reset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: eekiaggyowywtzbgdhbm
    steps:
      - name: Testar draw e all em subtransações revertidas
        run: |
          node --input-type=module <<'NODE'
          const query = `DO $probe$
          DECLARE probe_mode text; error_state text; error_context text;
          BEGIN
            FOREACH probe_mode IN ARRAY ARRAY['draw', 'all']
            LOOP
              BEGIN
                PERFORM public.reset_christmas_event(probe_mode, 'REINICIAR');
                RAISE EXCEPTION 'ROLLBACK_ONLY' USING ERRCODE = 'P9001';
              EXCEPTION WHEN OTHERS THEN
                GET STACKED DIAGNOSTICS error_state = RETURNED_SQLSTATE,
                                        error_context = PG_EXCEPTION_CONTEXT;
                IF error_state <> 'P9001' THEN
                  RAISE EXCEPTION 'RESET_PROBE mode=% state=% context=%',
                    probe_mode, error_state, left(error_context, 250) USING ERRCODE = 'P9002';
                END IF;
              END;
            END LOOP;
          END $probe$`
          const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_ID}/database/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query }),
            signal: AbortSignal.timeout(30000),
          })
          const data = await response.json().catch(() => ({}))
          if (!response.ok) {
            console.error('Prova de rollback:', response.status, String(data.message || data.error || '').slice(0,400))
            process.exitCode = 1
          } else {
            console.log('Ambos os modos passaram, com todas as alterações revertidas.')
          }
          NODE
